[package]
name = "teologia-ai"
version = "0.1.0"
edition = "2021"
description = "teologia.ai platform — Rust WASM core for the æ:// devotional surface"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
