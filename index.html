<style>
:root{--void:#050505;--gold:#D4AF37;--gold-hi:#ffda83;--neon:#00ff9d;--cyan:#70dcff;--ink:#e8e6df;--muted:#6f6a5c;--frame:#0c0c0c;--line:rgba(212,175,55,.18)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;background:var(--void);color:var(--ink);font-family:'JetBrains Mono',monospace;overflow-x:hidden;overflow-y:auto}
#grid{position:fixed;inset:0;z-index:0}
.scan{position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(212,175,55,.025) 0 1px,transparent 1px 3px)}
.vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 30%,rgba(0,0,0,.72) 100%)}
.wrap{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;max-width:640px;margin:0 auto;padding:0 18px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 0 12px;border-bottom:1px solid var(--line);font-size:10px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
.bar .b1{color:var(--gold);font-weight:700}
.bar .live{display:flex;align-items:center;gap:6px;color:var(--neon)}
@media(max-width:520px){.bar .mid{display:none}}
.dot{width:6px;height:6px;border-radius:50%;background:var(--neon);box-shadow:0 0 8px var(--neon);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.core{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:26px 0}
.glyph{font-size:clamp(56px,18vw,104px);line-height:1;color:var(--gold);text-shadow:0 0 34px rgba(212,175,55,.5);font-family:'Orbitron';font-weight:900;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.03)}}
.coord{font-size:clamp(20px,6.4vw,34px);font-weight:700;letter-spacing:2px;white-space:nowrap}
.coord .ax{transition:color .2s}
.coord .x,.coord .y,.coord .z{color:var(--neon)}
.coord .a{color:var(--gold-hi);text-shadow:0 0 16px rgba(212,175,55,.5)}
.coord .sep{color:var(--muted);opacity:.5}
.coord .num{display:inline-block;min-width:.6em}
.tag{font-size:10px;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
.prompt{font-size:clamp(15px,4.6vw,20px);color:var(--gold);letter-spacing:1px}
.prompt .blink{display:inline-block;width:9px;height:1.05em;background:var(--gold);vertical-align:-2px;margin-left:2px;animation:blink 1s step-end infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.log{width:100%;max-width:520px;border:1px solid var(--line);background:rgba(5,5,5,.55);padding:12px 14px;font-size:11px;line-height:1.7;color:var(--muted);text-align:left;min-height:118px;white-space:pre-wrap;word-break:break-word}
.log .ok{color:var(--neon)}
.log .g{color:var(--gold)}
.log .c{color:var(--cyan)}
.inrow{display:flex;width:100%;max-width:520px;border:1px solid var(--line);background:rgba(5,5,5,.7)}
.inrow .p{color:var(--gold);padding:0 0 0 14px;display:flex;align-items:center;font-size:14px}
#cmd{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--ink);font-family:inherit;font-size:14px;padding:13px 10px;letter-spacing:.5px}
#go{background:var(--gold);color:var(--void);border:none;font-family:'Orbitron';font-weight:700;font-size:11px;letter-spacing:1px;padding:0 20px;cursor:pointer;text-transform:uppercase}
#go:hover{background:var(--gold-hi)}
.mesh{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:520px;padding-bottom:16px}
.door{display:flex;flex-direction:column;gap:3px;padding:10px 11px;border:1px solid var(--line);background:rgba(212,175,55,.03);color:var(--ink);text-decoration:none;transition:all .18s;min-width:0}
.door:hover{border-color:var(--gold);background:rgba(212,175,55,.09);transform:translateY(-2px)}
.door b{font-size:11px;color:var(--gold);letter-spacing:.5px}
.door small{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.door .ax{font-size:8px;color:var(--cyan);letter-spacing:1px}
@media(max-width:520px){.mesh{grid-template-columns:repeat(2,1fr)}}
@media(max-width:360px){.mesh{grid-template-columns:1fr}}
.hint{font-size:9px;color:var(--muted);letter-spacing:1px;padding-bottom:10px;opacity:.7}

<body>
<canvas id="grid"></canvas>
<div class="scan"></div><div class="vig"></div>
<div class="wrap">
  <div class="bar">
    <span class="b1">æææ:// · ORIGIN</span>
    <span class="mid">LANGUAGE · IMPLEMENTATION · RUNTIME</span>
    <span class="live"><span class="dot"></span><span id="meshstate">1/8</span></span>
  </div>
  <div class="core">
    <div class="glyph">☺</div>
    <div class="coord" id="coord">
      <span class="ax x">x<span class="num" id="cx">0</span></span><span class="sep">:</span><span class="ax y">y<span class="num" id="cy">0</span></span><span class="sep">:</span><span class="ax z">z<span class="num" id="cz">0</span></span><span class="sep">:</span><span class="ax a">æ<span class="num" id="ca">0</span></span>
    </div>
    <div class="tag" id="where">you are here · the origin of æ-space</div>
    <div class="prompt">&gt;_æææ://|||<span class="blink"></span></div>
    <div class="log" id="log"></div>
    <div class="inrow">
      <span class="p">›</span>
      <input id="cmd" placeholder="goto x1:y0:z0:æ0 · or type 'help'" autocomplete="off" spellcheck="false">
      <button id="go">RUN</button>
    </div>
  </div>
  <div class="mesh" id="mesh"></div>
  <div class="hint">MOVE WITH WASD / ARROWS · ⌘K FOCUS · æ:// = the æ axis is the one you steer by</div>
</div>
<script>
(function(){'use strict';
var S={x:0,y:0,z:0,a:0};
var $=function(id){return document.getElementById(id)};
var AX={x:'cx',y:'cy',z:'cz',a:'ca'};
function render(){for(var k in AX){$(AX[k]).textContent=(S[k]>0?'+':'')+S[k]}var p=location.hash.replace('#','');$('where').textContent=(S.x===0&&S.y===0&&S.z===0&&S.a===0)?'you are here · the origin of æ-space':'offset from origin · x'+S.x+':y'+S.y+':z'+S.z+':æ'+S.a}
function setHash(){location.hash='x'+S.x+':y'+S.y+':z'+S.z+':æ'+S.a}
function parseHash(){var m=location.hash.match(/x(-?\d+):y(-?\d+):z(-?\d+):æ(-?\d+)/);if(m){S.x=+m[1];S.y=+m[2];S.z=+m[3];S.a=+m[4]}}
function log(t,cls){var el=$('log');el.innerHTML+='<span class="'+(cls||'')+'">'+t+'</span>\n';el.scrollTop=el.scrollHeight}
function typeSeq(lines,i){if(i>=lines.length)return;var L=lines[i];var el=$('log');el.innerHTML+='<span class="'+(L[1]||'')+'">'+L[0]+'</span>\n';el.scrollTop=el.scrollHeight;setTimeout(function(){typeSeq(lines,i+1)},L[2]||140)}

var BOOT=[
 ['æææ:// kernel · sovereign runtime','g',180],
 ['> locking origin ................ OK','ok',200],
 ['> x=0 y=0 z=0 æ=0 .............. LOCKED','ok',200],
 ['> mesh pairing ................. 1/8 online','c',200],
 ['> væult custody ................ local only','ok',200],
 ['> protocol æ:// ................ registered','ok',200],
 ['> ready. type \'help\' or move with WASD','',160]
];

// ── surface constellation (real surfaces on this origin) ──
var DOORS=[
 ['æ¹','Ética','indices/etica.html','who authorizes?'],
 ['æ²','Economía','indices/economia.html','who benefits?'],
 ['æ³','Ingeniería','indices/ingenieria.html','how we build?'],
 ['codæ','Home','home-codae.html','the language is compute'],
 ['▦','Bookstore','gospel-bookstore/index.html','librería cristiana'],
 ['▤','Command Map','command-map.html','every surface'],
 ['◈','The Mesh','the-mesh.html','agent constellation'],
 ['⧉','LLM.Store','llm-store.html','sovereign models'],
 ['✍','Start a Business','startabusiness.html','#startabusiness'],
 ['⚙','Mech OS','mech-os.html','mech primitives'],
 ['▣','Vault','vault.html','væult custody'],
 ['⌘','Keeper','keeper.html','report system state'],
 ['◫','væult','vaeult-demo.html','the tool chain'],
 ['∿','Internet of Agents','internetofagents.html','#internetofagents'],
 ['▧','cuda blueprint','cuda-blueprint.html','RTX 3050 · DAOLLC']
];
function buildMesh(){var m=$('mesh');m.innerHTML=DOORS.map(function(d){return '<a class="door" href="'+d[2]+'"><span class="ax">'+d[0]+'</span><b>'+d[1]+'</b><small>'+d[3]+'</small></a>'}).join('')}

// ── commands ──
function run(raw){
  var c=(raw||'').trim();if(!c)return;
  log('> '+c,'g');
  var low=c.toLowerCase();
  if(low==='help'){log('  goto x< n>:y< n>:z< n>:æ< n>  — move in 4-space','c');log('  origin              — return to x0:y0:z0:æ0','c');log('  æ://<surface>       — open a surface (e.g. æ://bookstore)','c');log('  scan                — verify the chain','c');log('  help                — this list','c')}
  else if(low==='origin'){S={x:0,y:0,z:0,a:0};render();setHash();log('  returned to origin','ok')}
  else if(low==='scan'||low==='verify'){log('  væult chain ......... 10/10 links answer','ok');log('  custody→format→gate→authority→contract→dispatch→publish→delivery→adoption','c')}
  else if(low.indexOf('goto')===0){var m=low.match(/x(-?\d+):y(-?\d+):z(-?\d+):æ(-?\d+)/);if(m){S.x=+m[1];S.y=+m[2];S.z=+m[3];S.a=+m[4];render();setHash();log('  moved to x'+S.x+':y'+S.y+':z'+S.z+':æ'+S.a,'ok')}else log('  usage: goto x1:y0:z0:æ0','')}
  else if(low.indexOf('æ://')===0||low.indexOf('ae://')===0){var name=low.replace(/^.*:\/\//,'');var hit=DOORS.filter(function(d){return d[1].toLowerCase().indexOf(name)>=0||d[2].toLowerCase().indexOf(name)>=0})[0];if(hit){log('  opening '+hit[1]+' …','ok');setTimeout(function(){location.href=hit[2]},450)}else log('  no surface "'+name+'" — try: '+DOORS.slice(0,4).map(function(d){return d[1]}).join(', '),'')}
  else if(low==='whoami'){log('  x0:y0:z0:æ0 · one principal · sovereign','ok')}
  else {log('  unknown: "'+c+'" — type \'help\'','')}
}

// ── keyboard: WASD / arrows steer the æ axis ──
document.addEventListener('keydown',function(e){
  var t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'))return;
  var k=e.key.toLowerCase();
  if(k==='a'||k==='arrowleft'){S.x--}
  else if(k==='d'||k==='arrowright'){S.x++}
  else if(k==='w'||k==='arrowup'){S.y++}
  else if(k==='s'||k==='arrowdown'){S.y--}
  else if(k==='q'){S.z--}
  else if(k==='e'){S.z++}
  else if(k==='z'){S.a--}
  else if(k==='x'){S.a++}
  else if(k==='k'&&(e.metaKey||e.ctrlKey)){e.preventDefault();$('cmd').focus();return}
  else return;
  e.preventDefault();render();setHash();
});
$('go').addEventListener('click',function(){run($('cmd').value);$('cmd').value=''});
$('cmd').addEventListener('keydown',function(e){if(e.key==='Enter'){run($('cmd').value);$('cmd').value=''}});
window.addEventListener('hashchange',function(){parseHash();render()});

// ── protocol handler: æ:// within the page (browser-level) ──
try{if(navigator.registerProtocolHandler){navigator.registerProtocolHandler('web+ae',location.origin+'/?q=%s');log('> protocol web+æ:// ............. registered','ok')}}catch(e){}

// ── faint 4-space grid canvas ──
function drawGrid(){var c=$('grid'),x=c.getContext('2d');var dpr=Math.min(2,window.devicePixelRatio||1);function fit(){c.width=innerWidth*dpr;c.height=innerHeight*dpr;x.setTransform(dpr,0,0,dpr,0,0)}fit();window.addEventListener('resize',fit);
 var t=0;function loop(){x.clearRect(0,0,innerWidth,innerHeight);var h=innerHeight,w=innerWidth;var hy=h*0.46;x.strokeStyle='rgba(0,255,157,.06)';x.lineWidth=1;
  for(var i=-12;i<=12;i++){x.beginPath();x.moveTo(w/2+i*46,hy);x.lineTo(w/2+i*220,h);x.stroke()}
  for(var j=0;j<14;j++){var yy=hy+(h-hy)*(j/14)+ (t%60)*0.4;x.beginPath();x.moveTo(0,yy);x.lineTo(w,yy);x.stroke()}
  x.strokeStyle='rgba(212,175,55,.10)';x.beginPath();x.moveTo(w/2,0);x.lineTo(w/2,h);x.stroke();
  t+=0.4;requestAnimationFrame(loop)}loop()}

parseHash();render();buildMesh();drawGrid();typeSeq(BOOT,0);
})();
</script>
</body>
