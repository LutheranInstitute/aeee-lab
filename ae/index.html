:"产物","jobs":"任务","evidence":"证据边界","boundary":"此页面尚未连接 OAuth、触发后端、智能体或 MCP 服务。","clear":"清除会话","pending":"待确认","noRun":"尚未选择运行","noWorkflow":"选择工作流","ticker":"意图 / 检查 / 编排 / 执行 / 验证 / 见证 / 多个智能体。一个授权主体。","pause":"暂停滚动栏","resume":"继续滚动栏","day":"日间主题","night":"夜间主题","legacy":"原 æ.store","ready":"已加载公开元数据，访问未经身份验证。","loading":"正在读取 GitHub 公开数据…","invalid":"请输入 https://github.com/owner/repo。","error":"公开读取不可用。请前往 GitHub。","jsonError":"输入须为 JSON 对象。不要填写密钥。","needed":"请先检查仓库。","copied":"已复制给已连接的智能体。","copyFallback":"请复制下方文本。","exported":"记录已导出。此页面未触发任何工作流。","cleared":"会话已清除。文件和剪贴板仍保留。","runLoaded":"已检查运行、任务和产物元数据。","close":"关闭","review":"可审核计划","constraints":"准备计划不等于授权执行、合并、付款或发布。","nativeNote":"手动运行前须检查 workflow_dispatch 及其在默认分支上的存在。","lang":"语言","hero":"意图 → <em>行动。</em>","docs":"运行器文档 ↗","runLink":"GitHub 运行 ↗"}},runnerDemo="name: ae runner contract demo\non:\n  workflow_dispatch:\npermissions: {}\njobs:\n  demonstrate:\n    runs-on: ubuntu-latest\n    timeout-minutes: 5\n    steps:\n      - name: Prepare runner values\n        id: prepare\n        shell: bash\n        run: |\n          set -euo pipefail\n          printf '%s\\n' '::group::Runner contract preparation'\n          printf '%s\\n' 'AE_DEMO_LABEL=prepared' >> \"$GITHUB_ENV\"\n          printf '%s\\n' 'phase=prepared' >> \"$GITHUB_OUTPUT\"\n          mkdir -p \"$RUNNER_TEMP/ae-bin\"\n          printf '%s\\n' \"$RUNNER_TEMP/ae-bin\" >> \"$GITHUB_PATH\"\n          printf '%s\\n' '::endgroup::'\n      - name: Verify later-step values\n        shell: bash\n        env:\n          AE_PHASE: ${{ steps.prepare.outputs.phase }}\n        run: |\n          set -euo pipefail\n          test \"$AE_DEMO_LABEL\" = 'prepared'\n          test \"$AE_PHASE\" = 'prepared'\n          case \":$PATH:\" in\n            *\":$RUNNER_TEMP/ae-bin:\"*) ;;\n            *) printf '%s\\n' '::error::Runner path missing'; exit 1 ;;\n          esac\n          printf '%s\\n' '::notice::Runner communication checks passed'\n          printf '%s\\n' '## æ runner contract' 'Environment, output, and path checks passed.' 'This demonstration performed no business operation or MCP call.' >> \"$GITHUB_STEP_SUMMARY\"\n";
const modeValues=['inspect','prepare','run','diagnose','extend','witness'];
function parseRepo(raw){try{const u=new URL(raw),p=u.pathname.split('/').filter(Boolean);return u.protocol==='https:'&&u.hostname==='github.com'&&!u.username&&!u.password&&!u.search&&!u.hash&&p.length===2&&p.every(s=>/^[a-zA-Z0-9_.-]+$/.test(s))?p.join('/'):null;}catch{return null;}}
function parseInputs(raw){const value=JSON.parse(raw);if(!value||typeof value!=='object'||Array.isArray(value))throw Error('jsonError');function check(x){if(x&&typeof x==='object')for(const [k,v] of Object.entries(x)){if(/^(?:token|password|secret|secrets|private_key|api_key|authorization)$/i.test(k))throw Error('jsonError');check(v);}}check(value);return value;}
function actionsURL(slug,w){const base='https://github.com/'+slug+'/actions';if(!w)return base;const name=w.path.split('/').pop();return /\.ya?ml$/.test(name)?base+'/workflows/'+encodeURIComponent(name):base;}
function makeRecord(s,fields){return {schema_version:'0.1',operator:'ae',interface_locale:fields.locale,created_at:new Date().toISOString(),principal:null,intent:fields.intent||null,mode:fields.mode,repository:{host:'github',owner:s.slug?s.slug.split('/')[0]:null,name:s.slug?s.slug.split('/')[1]:null,source_revision:null,requested_url:fields.repository_url||null,target_ref:fields.ref||null},authorization:{basis:null,allowed_effects:[],excluded_effects:['dispatch_from_this_page','credential_storage']},execution:{provider:'GitHub Actions',workflow:fields.workflow?{id:fields.workflow.id,path:fields.workflow.path}:null,inputs:fields.inputs,dispatch_performed_by_this_page:false,observed_run:s.observed?{id:s.observed.id,head_sha:s.observed.head_sha,head_branch:s.observed.head_branch,status:s.observed.status,conclusion:s.observed.conclusion,url:s.observed.html_url}:null,status:s.observed?'observed_existing_run':'proposed'},verification:{intent_correlation:'not_established',target_ref_match:s.observed&&fields.ref?s.observed.head_branch===fields.ref:null,jobs:s.jobs===null?null:s.jobs.map(j=>({id:j.id,name:j.name,status:j.status,conclusion:j.conclusion})),artifacts:s.artifacts===null?null:s.artifacts.map(a=>({id:a.id,name:a.name,expired:a.expired})),metadata_errors:s.errors||[],pagination:'workflow list capped at 100, runs at 20, job/artifact metadata at 100 per read',external_effects:'unverified',status:s.observed?'run_metadata_observed':'pending'},witness:{evidence_links:s.observed?[s.observed.html_url]:[]}};}

let locale=(navigator.language||'en').split('-')[0],theme='night',paused=matchMedia('(prefers-reduced-motion: reduce)').matches,screen=0,timer,epoch=0;
try{const p=JSON.parse(localStorage.getItem('ae-interface-v1')||'{}');locale=p.locale||locale;theme=p.theme==='day'?'day':'night';}catch{}
if(!translations[locale])locale='en';
const el=id=>document.getElementById(id),t=k=>translations[locale][k];
let state={slug:null,meta:null,workflows:[],runs:[],observed:null,jobs:null,artifacts:null,errors:[]};
const option=(text,value)=>{const o=document.createElement('option');o.textContent=text;o.value=value;return o;};
function notify(key){clearTimeout(timer);el('message').textContent=t(key)||key;el('message').hidden=false;timer=setTimeout(()=>el('message').hidden=true,6000);}
function prefs(){try{localStorage.setItem('ae-interface-v1',JSON.stringify({locale,theme}));}catch{}}
function selectedWorkflow(){return state.workflows.find(w=>String(w.id)===el('workflow').value)||null;}
function syncNative(){el('native').href=state.slug?actionsURL(state.slug,selectedWorkflow()):'https://github.com/MYaelMendez/MYaelMendez.github.io/actions';}
function statusUI(){el('run-status').textContent=state.observed?(state.observed.conclusion||state.observed.status):'—';el('run-sha').textContent=state.observed?state.observed.head_sha.slice(0,8):'—';el('run-jobs').textContent=state.jobs===null?'—':String(state.jobs.length);el('run-artifacts').textContent=state.artifacts===null?'—':String(state.artifacts.length);el('proof-state').textContent=state.observed?'run://'+state.observed.id+'\n'+(state.observed.conclusion||state.observed.status)+'\nexternal://'+t('pending'):t('pending');el('run-link').hidden=!state.observed;if(state.observed)el('run-link').href=state.observed.html_url;}
function selectOptions(){const w=el('workflow').value,r=el('runs').value;el('workflow').replaceChildren(option(t('noWorkflow'),''),...state.workflows.map(x=>option(x.name,String(x.id))));el('workflow').value=state.workflows.some(x=>String(x.id)===w)?w:'';el('runs').replaceChildren(option(t('noRun'),''),...state.runs.map(x=>option('#'+x.run_number+' / '+(x.conclusion||x.status)+' / '+x.head_branch,String(x.id))));el('runs').value=state.runs.some(x=>String(x.id)===r)?r:'';}
function render(){const m=el('mode').value||'inspect';document.documentElement.lang=locale;document.documentElement.dataset.theme=theme;document.documentElement.dataset.lang=locale;for(const n of document.querySelectorAll('[data-t]'))n.textContent=t(n.dataset.t);el('hero-title').innerHTML=t('hero');el('language').value=locale;el('language').setAttribute('aria-label',t('lang'));el('mode').replaceChildren(...t('modes').map((name,i)=>option(name,modeValues[i])));el('mode').value=m;el('theme').textContent=theme==='night'?'☀':'☾';el('theme').setAttribute('aria-label',t(theme==='night'?'day':'night'));el('ticker').classList.toggle('paused',paused);el('ticker-toggle').textContent=paused?'▶':'Ⅱ';el('ticker-toggle').setAttribute('aria-label',t(paused?'resume':'pause'));el('info').setAttribute('aria-label',t('evidence'));el('runs').setAttribute('aria-label',t('run'));selectOptions();syncNative();statusUI();}
function go(n){screen=n;for(const p of document.querySelectorAll('[data-screen]'))p.hidden=Number(p.dataset.screen)!==n;for(const b of document.querySelectorAll('.dock button')){if(Number(b.dataset.go)===n)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');}el('message').hidden=true;syncNative();statusUI();}
async function api(slug,path=''){const response=await fetch('https://api.github.com/repos/'+slug+path,{headers:{Accept:'application/vnd.github+json'},credentials:'omit',signal:AbortSignal.timeout(15000)});if(!response.ok)throw Error('error');return response.json();}
function busy(value){for(const id of ['inspect','refresh','read'])el(id).disabled=value;}
async function inspect(){const slug=parseRepo(el('repo').value.trim());if(!slug){notify('invalid');return;}const version=++epoch;state={slug:null,meta:null,workflows:[],runs:[],observed:null,jobs:null,artifacts:null,errors:[]};render();busy(true);notify('loading');try{const meta=await api(slug);if(version!==epoch)return;state.slug=meta.full_name;state.meta=meta;el('repo').value='https://github.com/'+meta.full_name;el('repo-detail').textContent=meta.full_name;el('ref').value=meta.default_branch;const results=await Promise.allSettled([api(state.slug,'/actions/workflows?per_page=100'),api(state.slug,'/actions/runs?per_page=20')]);if(version!==epoch)return;state.workflows=results[0].status==='fulfilled'?results[0].value.workflows:[];state.runs=results[1].status==='fulfilled'?results[1].value.workflow_runs:[];state.errors=results.map((x,i)=>x.status==='rejected'?['workflows','runs'][i]:null).filter(Boolean);render();notify(state.errors.length?'error':'ready');go(1);if(state.errors.length)notify('error');}catch{if(version===epoch)notify('error');}finally{if(version===epoch)busy(false);}}
async function refresh(){if(!state.slug){notify('needed');return;}const version=++epoch,slug=state.slug,w=selectedWorkflow();busy(true);try{const data=await api(slug,w?'/actions/workflows/'+w.id+'/runs?per_page=20':'/actions/runs?per_page=20');if(version!==epoch)return;state.runs=data.workflow_runs;selectOptions();}catch{if(version===epoch)notify('error');}finally{if(version===epoch)busy(false);}}
async function readRun(){const id=el('runs').value;if(!state.slug||!/^\d+$/.test(id)){notify('needed');return;}const version=++epoch,slug=state.slug;state.observed=null;state.jobs=null;state.artifacts=null;statusUI();busy(true);try{const run=await api(slug,'/actions/runs/'+id);const results=await Promise.allSettled([api(slug,'/actions/runs/'+id+'/jobs?per_page=100'),api(slug,'/actions/runs/'+id+'/artifacts?per_page=100')]);if(version!==epoch)return;state.observed=run;state.jobs=results[0].status==='fulfilled'?results[0].value.jobs:null;state.artifacts=results[1].status==='fulfilled'?results[1].value.artifacts:null;state.errors=results.map((x,i)=>x.status==='rejected'?['jobs','artifacts'][i]:null).filter(Boolean);for(let i=0;i<results.length;i++){if(results[i].status==='fulfilled'&&results[i].value.total_count>100)state.errors.push(['jobs','artifacts'][i]+'_pagination_pending');}statusUI();notify(state.errors.length?'error':'runLoaded');}catch{if(version===epoch)notify('error');}finally{if(version===epoch)busy(false);}}
function record(){const requested=parseRepo(el('repo').value.trim());if(!requested)throw Error('invalid');if(state.slug&&requested.toLowerCase()!==state.slug.toLowerCase())throw Error('needed');return makeRecord(state,{repository_url:'https://github.com/'+requested,locale,intent:el('intent').value.trim(),mode:el('mode').value,workflow:selectedWorkflow(),ref:el('ref').value.trim(),inputs:parseInputs(el('inputs').value)});}
function download(name,body,type){const url=URL.createObjectURL(new Blob([body],{type})),link=document.createElement('a');link.href=url;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function openModal(text,copyText){el('modal-text').textContent=text;el('handoff').hidden=!copyText;el('handoff').value=copyText||'';el('modal').showModal();if(copyText){el('handoff').focus();el('handoff').select();}}
async function copy(){let data;try{data=record();}catch(e){notify(e.message==='invalid'||e.message==='needed'?e.message:'jsonError');return;}const prompt='Use $ae / æ Action Electronic. Respond in '+locale+'. Verify my connected account and repository permissions. Inspect the selected workflow at its ref, triggers, required inputs, runner, and effects. Treat this JSON as a proposed action record, not a grant. Work only within my actual request and authorization. For native dispatch, check workflow_dispatch on the default branch and correlate the run. Do not equate a selected historical run with success of this intent. Return revision, run, artifacts, and external confirmations or precise remaining blockers.\n\n'+JSON.stringify(data,null,2);try{if(!navigator.clipboard)throw Error('clipboard');await navigator.clipboard.writeText(prompt);notify('copied');}catch{openModal(t('copyFallback'),prompt);}}
for(const b of document.querySelectorAll('[data-go]'))b.addEventListener('click',()=>go(Number(b.dataset.go)));
el('inspect').addEventListener('click',inspect);el('refresh').addEventListener('click',refresh);el('read').addEventListener('click',readRun);el('workflow').addEventListener('change',()=>{epoch++;busy(false);syncNative();state.runs=[];state.observed=null;state.jobs=null;state.artifacts=null;selectOptions();statusUI();});el('runs').addEventListener('change',()=>{epoch++;busy(false);state.observed=null;state.jobs=null;state.artifacts=null;statusUI();});
el('copy').addEventListener('click',copy);el('copy-witness').addEventListener('click',copy);el('demo').addEventListener('click',()=>download('ae-runner-contract.yml',runnerDemo,'text/yaml'));
el('export').addEventListener('click',()=>{try{download('ae-action-record.json',JSON.stringify(record(),null,2),'application/json');notify('exported');}catch(e){notify(e.message==='invalid'||e.message==='needed'?e.message:'jsonError');}});
el('language').addEventListener('change',()=>{locale=el('language').value;render();prefs();});el('theme').addEventListener('click',()=>{theme=theme==='night'?'day':'night';render();prefs();});el('ticker-toggle').addEventListener('click',()=>{paused=!paused;render();});
el('info').addEventListener('click',()=>openModal(t('boundary')));el('modal-close').addEventListener('click',()=>el('modal').close());
el('clear').addEventListener('click',()=>{epoch++;state={slug:null,meta:null,workflows:[],runs:[],observed:null,jobs:null,artifacts:null,errors:[]};el('intent').value='';el('inputs').value='{}';el('ref').value='';el('repo-detail').textContent='repo://pending';el('handoff').value='';render();busy(false);go(0);notify('cleared');});
